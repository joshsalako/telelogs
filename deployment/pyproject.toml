[project]
name = "telelogs-qwen-vllm"
version = "0.1.0"
description = "Local Qwen3.6-27B vLLM deployment for Telelogs synthesis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bitsandbytes>=0.49.2",
    "vllm>=0.19.0",
    "transformers @ git+https://github.com/huggingface/transformers.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwen_vllm"]
